<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Рассвет · Заготовки</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  @font-face{font-family:"Corbel Rassvet";src:url("corbel.ttf") format("truetype");font-weight:400;font-style:normal;font-display:swap}
  @font-face{font-family:"Corbel Rassvet";src:url("corbelb.ttf") format("truetype");font-weight:600 700;font-style:normal;font-display:swap}
  :root{
    --olive:#96A466; --olive-2:#A9B67C; --olive-soft:#E7ECCD;
    --forest:#0A3320; --forest-2:#164A30;
    --cream:#F2F5CF; --paper:#FAFBEF; --card:#FFFFFF;
    --muted:#667A5B; --line:rgba(10,51,32,.10);
    --warm:#C2652B; --warm-soft:#F8E6D6; --ok:#3F7A3A; --ok-soft:#E1EED7; --danger:#B4412F;
    --r:18px; --focus:#FFFFFF;
  }
  html[data-theme="dark"]{
    --olive-soft:#26331F; --forest:#E6ECCF; --forest-2:#C3CEAA;
    --cream:#121C15; --paper:#0E1611; --card:#18231B; --focus:#0B120E;
    --muted:#9AA88C; --line:rgba(230,236,207,.10);
    --warm:#E8995B; --warm-soft:#3B2B1C; --ok:#8CC47F; --ok-soft:#1E3220; --danger:#EC7A64;
  }
  html[data-theme="dark"] .hero{--forest:#0A3320; --forest-2:#164A30; --cream:#F2F5CF; color:#0A3320}
  html[data-theme="dark"] .tabs{box-shadow:0 6px 20px rgba(0,0,0,.35)}
  html[data-theme="dark"] .dock .btn{box-shadow:0 8px 24px rgba(0,0,0,.45)}
  html[data-theme="dark"] .st3,html[data-theme="dark"] .seg button.on.st3{background:#E6ECCF;color:#0A3320}
  html[data-theme="dark"] .mini.close{background:#E6ECCF;color:#0A3320}
  html[data-theme="dark"] #toast{background:#E6ECCF;color:#0A3320}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--paper);color:var(--forest);font:16px/1.4 "Corbel Rassvet",Corbel,-apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
  button,input,textarea{font:inherit;color:inherit}

  /* ---------- шапка ---------- */
  .hero{position:relative;background:var(--olive);color:var(--forest);padding:18px 18px 54px;overflow:hidden}
  .hero svg.loop{position:absolute;right:-30px;top:-20px;width:220px;opacity:.55;pointer-events:none}
  .brand{display:flex;align-items:center;gap:14px;position:relative}
  .logo{width:60px;height:60px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 0 3px var(--cream)}
  .brand h1{margin:0;font-size:24px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;line-height:1}
  .brand p{margin:5px 0 0;font-size:14px;color:var(--forest)}
  .hello{position:relative;margin-top:14px;font-size:15px;color:var(--forest);font-weight:600}
  /* кнопки в шапке: инструкция и профиль */
  .hero-acts{position:absolute;top:16px;right:16px;display:flex;gap:8px;z-index:2}
  .hbtn{width:40px;height:40px;border-radius:50%;border:0;background:rgba(242,245,207,.9);color:#0A3320;font-size:18px;font-weight:700;cursor:pointer;display:grid;place-items:center;box-shadow:0 2px 8px rgba(10,51,32,.15)}
  .hbtn.me{background:#0A3320;color:#F2F5CF}
  .hbtn.me.on{box-shadow:0 0 0 3px #F2F5CF}
  .hbtn:active{transform:scale(.94)}
  /* инструкция */
  .help details{border-bottom:1px solid var(--line)}
  .help details:last-child{border-bottom:0}
  .help summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:13px 0;font-weight:600;font-size:16px}
  .help summary::-webkit-details-marker{display:none}
  .help summary::after{content:"›";margin-left:auto;font-size:22px;color:var(--muted);transition:transform .2s}
  .help details[open] summary::after{transform:rotate(90deg)}
  .help summary .ic{width:30px;text-align:center;font-size:18px}
  .help ul{margin:0 0 12px;padding-left:20px}
  .help li{margin:6px 0;font-size:15px;line-height:1.45;color:var(--forest-2)}

  /* ---------- вкладки ---------- */
  .tabs-wrap{position:sticky;top:0;z-index:5;margin-top:-30px;padding:0 12px}
  .tabs{display:flex;gap:4px;overflow-x:auto;position:relative;background:var(--card);border-radius:999px;padding:5px;box-shadow:0 6px 20px rgba(10,51,32,.10);scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:1 0 auto;border:0;background:none;padding:9px 12px;border-radius:999px;font-size:14px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap;transition:.2s}
  .tab.on{background:var(--forest);color:var(--cream)}
  .tab{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  .tabs.drag{scroll-behavior:auto}
  .tab.lift{position:relative;z-index:2;transition:box-shadow .2s,background .2s;background:var(--olive-soft);color:var(--forest);box-shadow:0 6px 16px rgba(10,51,32,.25)}
  .tab.lift.on{background:var(--forest);color:var(--cream)}

  main{padding:16px 12px 120px}
  .card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px;border:1px solid var(--line)}
  .card h2{margin:0 0 4px;font-size:19px;font-weight:600}
  .sub{color:var(--muted);font-size:14px;margin:0 0 10px}
  h3{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}

  /* ---------- подсчёт ---------- */
  .progress{height:6px;background:var(--olive-soft);border-radius:9px;overflow:hidden;margin:10px 0 4px}
  .progress i{display:block;height:100%;background:var(--olive);border-radius:9px;transition:width .25s}
  .prow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .prow:last-child{border-bottom:0}
  .pname{flex:1;min-width:0}
  .pname b{display:block;font-weight:500;font-size:16px;word-break:break-word}
  .pname span{font-size:13px;color:var(--muted)}
  .tag{display:none;margin-left:6px;font-size:11px;font-weight:600;color:var(--warm);background:var(--warm-soft);padding:2px 7px;border-radius:999px;vertical-align:1px}
  .prow.low .tag{display:inline-block}
  .field{display:flex;align-items:center;background:var(--cream);border-radius:12px;padding:0 10px 0 4px;border:1.5px solid transparent;transition:.15s}
  .field:focus-within{border-color:var(--olive);background:var(--focus)}
  .prow.low .field{background:var(--warm-soft)}
  .field input{width:64px;border:0;background:none;padding:10px 4px 10px 8px;text-align:right;font-size:17px;font-weight:500;outline:none}
  .field small{color:var(--muted);font-size:13px;min-width:14px}

  /* ---------- список «сварить» ---------- */
  .need{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .need:last-child{border-bottom:0}
  .need .dot{width:40px;height:40px;border-radius:50%;background:var(--olive);color:var(--cream);display:grid;place-items:center;flex:0 0 auto;font-size:18px;font-weight:600}
  .need .pname span{display:block}
  .pill{font-weight:600;color:var(--warm);background:var(--warm-soft);padding:6px 11px;border-radius:999px;white-space:nowrap;font-size:15px}
  .status{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;background:var(--ok-soft);color:var(--ok);font-weight:500;margin-top:12px}
  .status .big{font-size:28px}

  .empty{text-align:center;padding:28px 10px}
  .empty .icon{width:76px;height:76px;margin:0 auto 12px;border-radius:50%;background:var(--olive-soft);display:grid;place-items:center;font-size:34px}
  .empty h2{margin:0 0 6px}

  /* ---------- кнопки ---------- */
  .btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:600;cursor:pointer;background:var(--forest);color:var(--cream);margin-top:14px;transition:transform .1s,opacity .2s}
  .btn:active{transform:scale(.98)}
  .btn:disabled{opacity:.5}
  .btn.locked{opacity:.6;font-size:15px}
  .btn.soft{background:var(--olive-soft);color:var(--forest)}
  .btn.ok{background:var(--olive);color:var(--forest)}
  .dock{position:fixed;left:0;right:0;bottom:0;padding:12px 12px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--paper) 30%);z-index:6}
  .dock .btn{margin:0;box-shadow:0 8px 24px rgba(10,51,32,.25)}

  .check{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .check:last-child{border-bottom:0}
  .reg{border-bottom:1px solid var(--line)}
  .reg:last-child{border-bottom:0}
  .reg summary{list-style:none;cursor:pointer;padding:13px 0;font-weight:600;display:flex;justify-content:space-between;gap:10px}
  .reg summary::-webkit-details-marker{display:none}
  .reg summary::after{content:'›';color:var(--muted);transition:.15s}
  .reg[open] summary::after{transform:rotate(90deg)}
  .reg .rt{padding:0 0 14px;font-size:15px;line-height:1.5}
  .reg .rt h3{font-size:15px;margin:14px 0 4px}
  .reg .rt p{margin:0 0 6px}
  .reg .rt li{margin:0 0 4px 18px}
  .reg mark{background:var(--warm-soft);color:inherit;border-radius:4px;padding:0 2px}
  .skd{display:block;color:var(--muted);font-size:13px;font-weight:400;margin-top:2px}
  .box{width:28px;height:28px;border-radius:9px;border:2px solid var(--olive);display:grid;place-items:center;flex:0 0 auto;color:transparent;font-weight:700;transition:.15s}
  .check.on .box{background:var(--forest);border-color:var(--forest);color:var(--cream)}
  .check.made{cursor:default}
  .check.made .box{background:var(--olive);border-color:var(--olive);color:var(--forest)}
  .check.made b{text-decoration:line-through;opacity:.6}
  .yld{display:none;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;cursor:default}
  .check.on .yld{display:flex}
  .yld em{font-style:normal;font-size:13px;font-weight:600;color:var(--forest)}
  .yld .field{background:var(--focus);border-color:var(--forest)}
  .yld .field.bad{border-color:var(--danger)}
  /* «Сварил что-то ещё» — сворачиваемый блок */
  details.card>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px}
  details.card>summary::-webkit-details-marker{display:none}
  details.card>summary .pname h2{margin:0}
  details.card>summary .pname .sub{margin:2px 0 0}
  details.card>summary::after{content:"›";font-size:24px;line-height:1;color:var(--muted);transition:transform .2s}
  details.card[open]>summary::after{transform:rotate(90deg)}
  details.card[open]>summary{margin-bottom:4px}
  .dock.hide{display:none}
  /* холодильник */
  .batch{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .batch:last-child{border-bottom:0}
  .batch .acts{display:flex;gap:6px;flex:0 0 auto}
  .days.frz{background:#DCE6F0;color:#3B5872}
  html[data-theme="dark"] .days.frz{background:#1E2B38;color:#A9C4DE}
  .frzline{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px}
  .frzline em{font-style:normal;font-size:13px;color:var(--muted)}
  .switch{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:14px;cursor:pointer}
  .switch input,.edit .switch input{width:20px;height:20px;flex:0 0 20px;padding:0;accent-color:var(--forest);margin:0}
  /* профиль */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  .stat{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center}
  .stat b{display:block;font-size:22px;font-weight:600}
  .stat span{font-size:12px;color:var(--muted)}
  .badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
  .badge2{border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center;background:var(--card)}
  .badge2 .ic{font-size:28px;line-height:1.2}
  .badge2 b{display:block;font-size:13px;font-weight:600;margin-top:4px;line-height:1.2}
  .badge2 small{display:block;font-size:11px;color:var(--muted);margin-top:3px;line-height:1.2}
  .badge2.off{opacity:.55}
  .badge2.off .ic{filter:grayscale(1)}
  .badge2 .bar{height:4px;background:var(--olive-soft);border-radius:4px;margin-top:6px;overflow:hidden}
  .badge2 .bar i{display:block;height:100%;background:var(--olive)}
  .bk-when{flex:0 0 56px;height:60px;border-radius:14px;background:var(--olive);color:var(--forest);display:grid;place-items:center;text-align:center;line-height:1.05}
  .bk-when b{font-size:18px;display:block}
  .bk-when small{font-size:11px;opacity:.8}
  .shelf{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
  .shelf:last-child{border-bottom:0}
  .days{font-weight:600;padding:5px 11px;border-radius:999px;background:var(--olive-soft);white-space:nowrap;font-size:14px}
  .days.soon{background:var(--warm-soft);color:var(--warm)}
  .days.today{background:var(--danger);color:#fff}

  /* ---------- техкарты ---------- */
  .tkbtn{border:0;background:var(--olive-soft);color:var(--forest);border-radius:10px;padding:7px 10px;font-size:13px;font-weight:600;cursor:pointer;flex:0 0 auto}
  .tkrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .tkrow:last-child{border-bottom:0}
  .sheet-bg{position:fixed;inset:0;background:rgba(10,51,32,.45);z-index:20;display:flex;align-items:flex-end;animation:fade .2s}
  .sheet{background:var(--paper);width:100%;max-height:92vh;overflow-y:auto;border-radius:24px 24px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom));animation:up .25s ease-out}
  .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:6px auto 12px}
  @keyframes up{from{transform:translateY(40px);opacity:.4}}
  @keyframes fade{from{opacity:0}}
  .sheet h2{margin:0;font-size:22px}
  .amount{display:flex;align-items:center;gap:10px;background:var(--forest);color:var(--cream);border-radius:16px;padding:12px 14px;margin:12px 0}
  .amount span{flex:1;font-size:14px;opacity:.85}
  .amount input{width:90px;border:0;border-radius:10px;padding:9px;text-align:right;font-size:20px;font-weight:600;background:var(--cream);color:var(--forest);outline:none}
  .sizes{display:flex;gap:8px;margin:12px 0}
  .sizes button{flex:1;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:10px;font-weight:600;cursor:pointer}
  .sizes button.on{background:var(--forest);color:var(--cream);border-color:var(--forest)}
  .ing{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:16px}
  .ing:last-child{border-bottom:0}
  .ing b{white-space:nowrap}
  .ing{align-items:center}
  .ing .field{flex:0 0 auto}
  .ing .field input{width:78px;font-size:16px;padding:8px 4px 8px 6px}
  .ing.own .field{background:var(--focus);border-color:var(--forest)}
  .ing.limit span{color:var(--warm);font-weight:600}
  .ing input:disabled{opacity:.4}
  .method{white-space:pre-wrap;font-size:15px;line-height:1.5;color:var(--forest-2)}
  select{width:100%;border:1.5px solid transparent;background:var(--cream);border-radius:10px;padding:10px 12px;outline:none;font:inherit;color:var(--forest);appearance:none}
  .cl-row{display:flex;gap:8px;margin-bottom:8px}
  .cl-row input{flex:1}

  /* ---------- статусы ---------- */
  .stb{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:1px;white-space:nowrap}
  .st0{background:#DCE6F0;color:#3B5872}
  .st1{background:#E1EBC9;color:#4C5E1F}
  .st2{background:#F6E1BE;color:#8A5414}
  .st3{background:#0A3320;color:#F2F5CF}
  .st4,.seg button.on.st4{background:#EADCF0;color:#5E3A72}
  .st5,.seg button.on.st5{background:#F3D9D2;color:#86372A}
  .seg{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .seg button{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
  .seg button.on{border-color:transparent}
  .seg button.on.st0{background:#DCE6F0;color:#3B5872}
  .seg button.on.st1{background:#E1EBC9;color:#4C5E1F}
  .seg button.on.st2{background:#F6E1BE;color:#8A5414}
  .seg button.on.st3{background:#0A3320;color:#F2F5CF}
  .strow{padding:10px 0;border-bottom:1px solid var(--line)}
  .bdin{width:62px;border:1.5px solid transparent;background:var(--cream);border-radius:8px;padding:4px 6px;text-align:center;font:inherit;color:var(--forest);outline:none}
  .bdin:focus{border-color:var(--olive)}
  .strow:last-child{border-bottom:0}
  .form input,.form textarea{width:100%;border:1.5px solid transparent;background:var(--cream);border-radius:12px;padding:11px 12px;outline:none;margin-top:6px}
  .form input:focus,.form textarea:focus{border-color:var(--olive);background:var(--focus)}
  .form label{display:block;margin-top:12px;font-size:13px;color:var(--muted);font-weight:500}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .task{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .task:last-child{border-bottom:0}
  .task .box{margin-top:2px;cursor:pointer}
  .task.done b{text-decoration:line-through;opacity:.55}
  .task.done .box{background:var(--olive);border-color:var(--olive);color:var(--forest)}
  .ev{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
  .ev:last-child{border-bottom:0}
  .evd{flex:0 0 56px;height:60px;border-radius:14px;background:var(--forest);color:var(--cream);display:grid;place-items:center;text-align:center;line-height:1.05}
  .evd b{font-size:22px;display:block}
  .evd small{font-size:11px;text-transform:uppercase;opacity:.8}
  .tabcount{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--warm);color:#fff;font-size:11px;margin-left:5px;vertical-align:1px}

  /* ---------- график по дням ---------- */
  .dayhead{display:flex;align-items:center;gap:8px}
  .dayhead .grow{flex:1;text-align:center}
  .dayhead h2{margin:0}
  .navb{width:38px;height:38px;border-radius:50%;border:0;background:var(--olive-soft);color:var(--forest);font-size:22px;line-height:1;cursor:pointer;flex:0 0 auto}
  .navb:disabled{opacity:.3}
  .strip{display:flex;gap:6px;overflow-x:auto;margin:12px -16px 4px;padding:2px 16px 6px;scrollbar-width:none;scroll-snap-type:x proximity}
  .strip::-webkit-scrollbar{display:none}
  .dchip{flex:0 0 46px;border:0;border-radius:14px;padding:7px 0;background:var(--paper);color:var(--forest);text-align:center;cursor:pointer;scroll-snap-align:center;line-height:1.15}
  .dchip small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase}
  .dchip b{font-size:17px}
  .dchip.today{box-shadow:inset 0 0 0 2px var(--olive)}
  .dchip.on{background:var(--forest);color:var(--cream)}
  .dchip.on small{color:var(--olive-2)}
  .dchip.wk{margin-left:8px}
  #dayBody{touch-action:pan-y;transition:transform .22s ease,opacity .22s ease}
  #dayBody.out-l{transform:translateX(-30px);opacity:0}
  #dayBody.out-r{transform:translateX(30px);opacity:0}
  .wip{text-align:center;padding:26px 10px 18px;color:var(--muted)}
  .wip b{display:block;font-size:17px;color:var(--forest);margin:8px 0 4px}

  /* ---------- смена ---------- */
  .shift{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
  .shift:last-child{border-bottom:0}
  .shift .ava{position:relative}
  .shift.now .ava::after{content:"";position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;border-radius:50%;background:#3FA34D;border:2px solid var(--card)}
  .shift.past{opacity:.5}
  .time{font-weight:600;white-space:nowrap;font-size:15px}
  .mini{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--olive-soft);margin-left:6px;vertical-align:1px}
  .mini.close{background:var(--forest);color:var(--cream)}

  /* ---------- фото ---------- */
  .photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
  .ph{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--olive-soft);display:grid;place-items:center}
  .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .ph .x{position:absolute;top:4px;right:4px;width:28px;height:28px;font-size:16px;border-radius:50%;background:rgba(10,51,32,.75);color:#fff}
  .ph.loading img{opacity:.45}
  .ph.loading::after{content:"";position:absolute;width:26px;height:26px;border:3px solid var(--cream);border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .ph.add{border:2px dashed var(--olive);background:var(--paper);color:var(--forest);font-weight:600;font-size:14px;cursor:pointer;text-align:center;line-height:1.2}
  .ph.add b{display:block;font-size:28px;font-weight:400}
  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:30;display:grid;place-items:center;padding:16px}
  .lightbox img{max-width:100%;max-height:100%;border-radius:8px}
  .hcard{cursor:pointer}
  .hmeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chk-row{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:15px}
  .chk-row:last-child{border-bottom:0}
  .chk-row.no{color:var(--danger)}

  /* ---------- админка ---------- */
  .edit{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
  .edit .top{display:flex;gap:8px;align-items:center}
  .edit input{width:100%;border:1.5px solid transparent;background:var(--cream);border-radius:10px;padding:10px 12px;outline:none}
  .edit input:focus{border-color:var(--olive);background:var(--focus)}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
  .grid3 label{font-size:12px;color:var(--muted);display:block}
  .grid3 input{margin-top:3px;text-align:center}
  .nd{margin-top:8px}
  .nd summary{font-size:13px;color:var(--muted);cursor:pointer}
  .grid3.nd7{grid-template-columns:repeat(7,1fr);gap:4px}
  .grid3.nd7 input{padding:8px 2px;font-size:14px}
  .grid3.nd7 input::placeholder{opacity:.4}
  .x{border:0;background:var(--warm-soft);color:var(--danger);width:40px;height:40px;border-radius:10px;font-size:20px;cursor:pointer;flex:0 0 auto}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-size:15px;cursor:pointer;transition:.15s}
  .chip.on{background:var(--forest);border-color:var(--forest);color:var(--cream)}
  .chip.on::before{content:"✓ "}
  .grchips .chip.on::before{content:none}
  .grchips .chip.busy{opacity:.6;border-style:dashed}
  .grlist2{margin-top:6px}
  .grrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .grrow:last-child{border-bottom:0}
  .grday{flex:1;min-width:0}
  .grday b{display:block;font-size:16px;text-transform:capitalize}
  .grday span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
  .grbtn{flex:0 0 auto;border:1.5px solid var(--line);background:var(--card);color:inherit;border-radius:999px;padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
  .grbtn.on{background:var(--forest);border-color:var(--forest);color:var(--cream)}
  .grbtn.busy{opacity:.6;border-style:dashed}
  .grleft{color:var(--muted);font-size:12px}
  .grchips .chip.on .grleft{color:inherit}
  .grlist{margin:6px 0 0;padding-left:18px;font-size:14px;line-height:1.45}
  .badge{display:inline-block;background:var(--olive-soft);border-radius:999px;padding:4px 10px;font-size:14px;margin:3px 4px 3px 0}
  textarea{width:100%;border:1.5px solid transparent;background:var(--cream);border-radius:12px;padding:10px 12px;outline:none;resize:vertical}
  textarea:focus{border-color:var(--olive);background:var(--focus)}
  .user{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
  .user:last-child{border-bottom:0}
  .ava{width:36px;height:36px;border-radius:50%;background:var(--olive);color:var(--forest);display:grid;place-items:center;font-weight:600;flex:0 0 auto}

  /* ---------- история ---------- */
  .hrow{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);font-size:15px}
  .hrow:last-child{border-bottom:0}
  .hrow.low b{color:var(--danger)}

  .loader{display:grid;place-items:center;min-height:60vh;gap:14px;color:var(--muted)}
  .loader img{width:84px;height:84px;border-radius:50%;animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(.92);opacity:.7}}
  #pull{position:fixed;top:4px;left:50%;width:36px;height:36px;margin-top:0;border-radius:50%;background:var(--card);box-shadow:0 4px 14px rgba(0,0,0,.18);z-index:15;opacity:0;transform:translate(-50%,0);pointer-events:none;display:grid;place-items:center;transition:opacity .15s}
  #pull::after{content:"↻";font-size:20px;color:var(--olive);font-weight:700}
  #pull.ready::after{color:var(--forest)}
  #pull.spin{animation:pspin .8s linear infinite}
  @keyframes pspin{from{transform:translate(-50%,40px) rotate(0)}to{transform:translate(-50%,40px) rotate(360deg)}}
  #toast{position:fixed;left:16px;right:16px;bottom:90px;background:var(--forest);color:var(--cream);padding:13px 16px;border-radius:14px;opacity:0;transform:translateY(16px);transition:.25s;pointer-events:none;z-index:9;text-align:center;font-weight:500}
  #toast.show{opacity:1;transform:none}
</style>
</head>

function compress(file) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 1280 / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.72));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Не удалось открыть фото')); };
    img.src = url;
  });
}

  const redraw = () => { wrap.querySelector('#gpgrid').innerHTML = grid(); wrap.querySelectorAll('[data-gp]').forEach(b => b.onclick = () => { ph.splice(+b.dataset.gp, 1); redraw(); }); sync(); };
  wrap.querySelector('#closeSheet').onclick = closeSheet;
  wrap.onclick = e => { if (e.target === wrap) closeSheet(); };
  wrap.querySelector('#gpinput').onchange = async e => {
    const files = [...e.target.files].slice(0, MAX - ph.length); e.target.value = '';
    for (const f of files) {
      let x; try { x = { src: await compress(f), loading: true }; } catch (er) { toast(er.message); continue; }
      ph.push(x); redraw();
      post('guPhoto', { data: x.src }).then(r => { x.id = r.id; x.loading = false; }).catch(() => { toast('Фото не загрузилось'); ph.splice(ph.indexOf(x), 1); }).finally(redraw);
    }
  };
  btn.onclick = async () => {
    if (ph.some(p => p.loading)) return toast('Подожди, фото загружаются…');
    const ids = ph.filter(p => p.id).map(p => p.id);
    if (!ids.length && !(await confirmBox('Фото уже выложил(а) в группу?'))) return;
    btn.disabled = true; btn.textContent = 'Отправляю…';
    try { await call('guDone', { mon: g.mon, photos: ids }); haptic('success'); toast('Спасибо! Генуборка отмечена ✅'); closeSheet(); me = await call('me'); render(); }
    catch (e) { toast(e.message); btn.disabled = false; sync(); }
  };
}

// Выполнить задачу: 2–5 фото результата (заказ посуды — без фото)
const TASK_PH_MIN = 2, TASK_PH_MAX = 5;
function openTaskDone(t, done) {
  closeSheet();
  const ph = [];
  const wrap = document.createElement('div'); wrap.className = 'sheet-bg'; wrap.id = 'sheet';
  const grid = () => ph.map((p, k) => `<div class="ph ${p.loading ? 'loading' : ''}"><img src="${p.src}" alt=""><button class="x" data-tp="${k}">×</button></div>`).join('') +
    (ph.length < TASK_PH_MAX ? `<label class="ph add" for="tpinput"><span><b>+</b>Фото</span></label>` : '');
  wrap.innerHTML = `<div class="sheet"><div class="grab"></div><h2>✅ Задача выполнена</h2>
    <p class="sub" style="margin-top:4px">${esc(t.text)}</p>
    <p class="sub">Приложи фото результата — <b>минимум ${TASK_PH_MIN}</b>, до ${TASK_PH_MAX}. ${esc(t.byName)} увидит их вместе с отметкой</p>
    <div class="photos" id="tpgrid">${grid()}</div><input type="file" id="tpinput" accept="image/*" multiple style="display:none">
    <button class="btn" id="tpSend">Отметить выполненной</button><button class="btn soft" id="closeSheet">Отмена</button></div>`;
  document.body.appendChild(wrap);
  const btn = wrap.querySelector('#tpSend');
  const sync = () => {
    const ok = ph.filter(p => p.id).length, busy = ph.some(p => p.loading);
    btn.classList.toggle('locked', ok < TASK_PH_MIN || busy);
    btn.textContent = busy ? '⏳ Загружаю фото…' : ok < TASK_PH_MIN ? '🔒 Добавь ещё ' + (TASK_PH_MIN - ok) + ' фото' : 'Отметить выполненной';
  };
  const redraw = () => { wrap.querySelector('#tpgrid').innerHTML = grid(); wrap.querySelectorAll('[data-tp]').forEach(b => b.onclick = () => { ph.splice(+b.dataset.tp, 1); redraw(); }); sync(); };
  wrap.querySelector('#closeSheet').onclick = closeSheet;
  wrap.onclick = e => { if (e.target === wrap) closeSheet(); };
  wrap.querySelector('#tpinput').onchange = async e => {
    const files = [...e.target.files].slice(0, TASK_PH_MAX - ph.length); e.target.value = '';
    for (const f of files) {
      let x; try { x = { src: await compress(f), loading: true }; } catch (er) { toast(er.message); continue; }
      ph.push(x); redraw();
      post('taskPhoto', { data: x.src }).then(r => { x.id = r.id; x.loading = false; }).catch(() => { toast('Фото не загрузилось'); ph.splice(ph.indexOf(x), 1); }).finally(redraw);
    }
  };
  btn.onclick = async () => {
    if (ph.some(p => p.loading)) return toast('Подожди, фото загружаются…');
    const ids = ph.filter(p => p.id).map(p => p.id);
    if (ids.length < TASK_PH_MIN) return toast('Приложи минимум ' + TASK_PH_MIN + ' фото');
    btn.disabled = true; btn.textContent = 'Отправляю…';
    try { await call('taskDone', { id: t.id, photos: ids }); haptic('success'); toast('Молодец! ✅'); closeSheet(); done && done(); }
    catch (e) { toast(e.message); btn.disabled = false; sync(); }
  };
  sync();
}
// Фото, которые приложили к выполненной задаче (видит тот, кто поставил, и админ)
function openTaskPhotos(t) {
  closeSheet();
  const wrap = document.createElement('div'); wrap.className = 'sheet-bg'; wrap.id = 'sheet';
  wrap.innerHTML = `<div class="sheet"><div class="grab"></div><h2>📷 Фото к задаче</h2><p class="sub" style="margin-top:4px">${esc(t.text)}</p>` +
    t.photos.map(g => `<h3>${esc(g.name)}</h3><div class="photos">${g.ids.map(id => `<div class="ph loading" data-pid="${esc(id)}"><img alt=""></div>`).join('')}</div>`).join('') +
    `<button class="btn soft" id="closeSheet">Закрыть</button></div>`;
  wrap.querySelector('#closeSheet').onclick = closeSheet;
  wrap.onclick = e => { if (e.target === wrap) closeSheet(); };
  document.body.appendChild(wrap);
  wrap.querySelectorAll('[data-pid]').forEach(async el => {
    const id = el.dataset.pid, img = el.querySelector('img');
    try {
      photoCache[id] = photoCache[id] || call('photo', { id }).then(r => r.data);
      img.src = await photoCache[id]; el.classList.remove('loading');
      img.onclick = () => lightbox(img.src);
    } catch (e) { delete photoCache[id]; el.classList.remove('loading'); el.innerHTML = '<span class="sub" style="font-size:12px">не загрузилось</span>'; }
  });
}

async function openTkForPrep(pid, amount) {
  const p = me.preps.find(x => x.id === pid);
  if (!p || !p.tk) return toast('Для этой заготовки техкарта не привязана');
  try { const c = (await getTk()).find(x => x.id === p.tk); if (!c) return toast('Техкарта не найдена в таблице'); openTk(c, p, amount); }
  catch (e) { toast(e.message); }
}

// ---- черновик закрытия (переживает закрытие приложения) ----
const DRAFT_KEY = 'rassvet_close_draft';
let draftTimer = null;
function saveDraft() {
  clearTimeout(draftTimer);
  draftTimer = setTimeout(() => {
    const data = { ts: Date.now(), checks: [...checks], draft, photos: photos.filter(p => p.id).map(p => ({ id: p.id, src: p.src })) };
    try { localStorage.setItem(DRAFT_KEY, JSON.stringify(data)); }
    catch (e) { try { data.photos = data.photos.map(p => ({ id: p.id, src: '' })); localStorage.setItem(DRAFT_KEY, JSON.stringify(data)); } catch (e2) {} }
  }, 300);
}
function loadDraft() {
  try {
    const d = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null');
    if (!d || Date.now() - d.ts > 10 * 3600e3) return false;
    (d.checks || []).forEach(k => checks.add(k));
    Object.assign(draft, d.draft || {});
    photos = (d.photos || []).map(p => ({ id: p.id, src: p.src || LOGO }));
    return checks.size || Object.keys(draft).length || photos.length;
  } catch (e) { return false; }
}
function clearDraft() { try { localStorage.removeItem(DRAFT_KEY); } catch (e) {} }

function photosGrid() {
  return photos.map((p, k) => `<div class="ph ${p.loading ? 'loading' : ''}"><img src="${p.src}" alt="" data-ph="${k}"><button class="x" data-phdel="${k}">×</button></div>`).join('') +
    (photos.length < 10 ? `<label class="ph add" for="phinput"><span><b>+</b>Фото</span></label>` : '');
}
function bindPhotos() {
  const grid = document.getElementById('phgrid'); if (!grid) return;
  const redraw = () => { grid.innerHTML = photosGrid(); bindPhotos(); };
  grid.querySelectorAll('[data-phdel]').forEach(b => b.onclick = () => { photos.splice(+b.dataset.phdel, 1); redraw(); saveDraft(); });
  grid.querySelectorAll('[data-ph]').forEach(im => im.onclick = () => lightbox(im.src));
  const inp = document.getElementById('phinput');
  inp.onchange = async () => {
    const files = [...inp.files].slice(0, 10 - photos.length); inp.value = '';
    for (const f of files) {
      let p;
      try { p = { src: await compress(f), loading: true }; } catch (e) { toast(e.message); continue; }
      photos.push(p); redraw();
      post('photoUpload', { data: p.src })
        .then(r => { p.id = r.id; p.loading = false; saveDraft(); })
        .catch(e => { toast('Фото не загрузилось: ' + e.message); photos.splice(photos.indexOf(p), 1); })
        .finally(() => { if (document.getElementById('phgrid')) redraw(); });
    }
  };
}

const stBadge = st => st ? `<span class="stb st${ST_LIST.indexOf(st)}">${ST_LABEL[st] || esc(st)}</span>` : '';
const statusOf = name => (me.statuses || {})[name] || '';
// Выбор адресатов: всем / по статусу / админам / выбрать людей
function audiencePicker(f, d, p, withAdmins) {
  const modes = [['all', 'Всем'], ['status', 'По статусу']].concat(withAdmins ? [['admins', 'Админам']] : []).concat([['people', 'Выбрать людей']]);
  let html = `<div class="seg">${modes.map(([m, l]) => `<button data-${p}mode="${m}" class="${f.mode === m ? 'on st3' : ''}">${l}</button>`).join('')}</div>`;
  if (f.mode === 'status') html += `<div class="seg" style="margin-top:10px">${(d.statuses || ST_LIST).map(st => `<button data-${p}st="${esc(st)}" class="${f.statuses.indexOf(st) >= 0 ? 'on st' + ST_LIST.indexOf(st) : ''}">${ST_LABEL[st]}</button>`).join('')}</div>`;
  if (f.mode === 'people') html += `<div class="chips" style="margin-top:10px">${(d.people || []).map(x => `<button class="chip ${f.ids.indexOf(x.id) >= 0 ? 'on' : ''}" data-${p}pid="${esc(x.id)}">${esc(x.name)}</button>`).join('') || '<p class="sub">Никто не подключён к боту</p>'}</div>`;
  return html;
}
function bindAudience(f, p) {
  document.querySelectorAll(`[data-${p}mode]`).forEach(b => b.onclick = () => { keepForm(p); f.mode = b.dataset[p + 'mode']; render(); });
  document.querySelectorAll(`[data-${p}st]`).forEach(b => b.onclick = () => { keepForm(p); const v = b.dataset[p + 'st'], i = f.statuses.indexOf(v); if (i >= 0) f.statuses.splice(i, 1); else f.statuses.push(v); render(); });
  document.querySelectorAll(`[data-${p}pid]`).forEach(b => b.onclick = () => { keepForm(p); const v = b.dataset[p + 'pid'], i = f.ids.indexOf(v); if (i >= 0) f.ids.splice(i, 1); else f.ids.push(v); render(); });
}
const formKeep = {};
function keepForm(p) { document.querySelectorAll(`[id^="${p}"]`).forEach(el => { if ('value' in el) formKeep[el.id] = el.value; }); }
function restoreForm(p) { Object.keys(formKeep).filter(k => k[0] === p).forEach(k => { const el = document.getElementById(k); if (el) el.value = formKeep[k]; }); }

// ===== График по дням (листается свайпом) =====
const DAYS_BACK = 7, DAYS_FWD = 7;   // график «На смене»: неделя назад и неделя вперёд
const shiftCache = {}, shiftLoading = {};
let curDay = null;
const addD = (date, n) => { const d = new Date(date + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const diffD = (a, b) => Math.round((new Date(a + 'T12:00:00Z') - new Date(b + 'T12:00:00Z')) / 864e5);
const wdS = ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'];
function loadShift(date) {
  if (shiftCache[date] !== undefined) return Promise.resolve(shiftCache[date]);
  if (!shiftLoading[date]) shiftLoading[date] = call('shiftDay', { date }).then(r => (shiftCache[date] = r.list)).catch(e => { delete shiftLoading[date]; throw e; });
  return shiftLoading[date];
}

function getHome(force) {
  if (homeData && !force) return Promise.resolve(homeData);

  return homeP;
}
const hmS = m => Math.floor(m / 60) % 24 + ':' + String(m % 60).padStart(2, '0');
function homeExtraHtml(d) {

    out += card(`<h2>Мои смены</h2><p class="sub">Ближайшие 7 дней</p>` + d.week.map(w => {
      const dt = new Date(w.date + 'T12:00:00Z'), lbl = w.date === today ? 'сегодня' : dt.toLocaleDateString('ru-RU', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' });
      const right = w.none ? '<span class="sub" style="margin:0">график в процессе</span>' : w.off ? '<span class="mini">выходной</span>'
        : `<span class="time">${hmS(w.from)} – ${hmS(w.to)}</span>`;
      const sw = mySwap(w.date);
      const act = !w.none && !w.off && w.date > today ? (sw ? `<span class="mini" style="background:var(--warm-soft);color:var(--warm)">${sw.status === 'taken' ? (sw.mode === 'swap' ? 'обмен: ' : 'замена: ') + esc(sw.takerName) : sw.mode === 'swap' ? 'ищем обмен' : 'ищем замену'}</span>`
        : `<button class="tkbtn" data-swap="${w.date}" style="margin-left:6px">Замена</button>`) : '';
      return `<div class="shift ${w.off || w.none ? 'past' : ''}"><div class="pname"><b style="text-transform:capitalize">${lbl}</b>${w.role ? `<span>${esc(w.role)}</span>` : ''}</div>${right}${act}</div>`;
    }).join(''));
  }
  // кто ищет замену
  const others = (d.swaps || []).filter(w => !w.mine || me.isAdmin);
  if (others.length) out += card(`<h2>🔄 Ищут замену</h2>` + others.map(w => `<div class="shift"><div class="pname"><b>${esc(w.byName)}</b> <span class="mini">${w.mode === 'swap' ? '🔄 обмен' : '🙋 отдаёт'}</span>
      <span>${new Date(w.date + 'T12:00:00Z').toLocaleDateString('ru-RU', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' })} · ${hmS(w.from)}–${hmS(w.to)}${w.status === 'taken' ? ' · ' + (w.mode === 'swap' ? 'меняется ' : 'берёт ') + esc(w.takerName) : ''}</span></div>
      ${w.status === 'open' && !w.mine ? `<button class="tkbtn" data-take="${esc(w.id)}" data-mode="${w.mode === 'swap' ? 'swap' : 'give'}">${w.mode === 'swap' ? '🔄 Поменяюсь' : '🙋 Возьму'}</button>` : ''}
      ${w.mine || me.isAdmin ? `<button class="x" data-swcancel="${esc(w.id)}">×</button>` : ''}</div>`).join(''));
  // дни рождения на неделю вперёд
  const bd = d.bdays || {}, soon = [];
  for (let i = 0; i < 8; i++) { const dd = addD(today, i), md = dd.slice(5); Object.keys(bd).forEach(n => { if (bd[n] === md) soon.push([n, i, dd]); }); }
  if (soon.length) out += card(`<h2>🎂 Дни рождения</h2>` + soon.map(([n, i, dd]) => `<div class="shift"><div class="ava">🎂</div><div class="pname"><b>${esc(n)}</b>
      <span>${i === 0 ? '<b style="color:var(--warm)">сегодня! поздравь 🎉</b>' : i === 1 ? 'завтра' : new Date(dd + 'T12:00:00Z').toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', timeZone: 'UTC' })}</span></div></div>`).join(''));
  // проблемы
  const pr = d.probs || [];
  out += card(`<h2>⚠️ Проблемы</h2><p class="sub">${pr.length ? 'Открытые — ждут решения' : 'Что-то сломалось или закончилось? Сообщи — админ сразу узнает'}</p>` +
    pr.map(p => `<div class="task"><div class="pname"><b>${esc(p.text)}</b><span>${esc(p.byName)} · ${fmtTs(p.at)}${p.photos ? ' · 📷 ' + p.photos : ''}</span></div>
      ${me.canCreate ? `<button class="tkbtn" data-pdone="${esc(p.id)}">✅ Решено</button>` : ''}</div>`).join('') +

// Окошко выбора: отдать смену или поменяться сменами. Возвращает 'give' | 'swap' | null
function chooseSwapMode(dayLabel) {
  return new Promise(res => {
    closeSheet();
    const wrap = document.createElement('div'); wrap.className = 'sheet-bg'; wrap.id = 'sheet';
    wrap.innerHTML = `<div class="sheet"><div class="grab"></div><h2>Замена на ${esc(dayLabel)}</h2>
      <p class="sub" style="margin-top:4px">В группу уйдёт заявка, админ подтвердит, график поправится сам</p>
      <button class="btn" data-m="give">🙋 Отдать смену</button><p class="sub" style="margin:6px 2px 0">Кто возьмёт — выйдет вместо тебя, у тебя выходной</p>
      <button class="btn ok" data-m="swap">🔄 Поменяться сменами</button><p class="sub" style="margin:6px 2px 0">Тот, кто работает в этот день, выйдет на твоё время, а ты — на его</p>
      <button class="btn soft" data-m="">Отмена</button></div>`;
    document.body.appendChild(wrap);
    const done = v => { closeSheet(); res(v || null); };
    wrap.querySelectorAll('[data-m]').forEach(b => b.onclick = () => done(b.dataset.m));
    wrap.onclick = e => { if (e.target === wrap) done(null); };
  });
}

function openProblem(done) {

  const grid = () => probPhotos.map((p, k) => `<div class="ph ${p.loading ? 'loading' : ''}"><img src="${p.src}" alt=""><button class="x" data-pp="${k}">×</button></div>`).join('') +

      post('probPhoto', { data: p.src }).then(r => { p.id = r.id; p.loading = false; }).catch(er => { toast('Фото не загрузилось'); probPhotos.splice(probPhotos.indexOf(p), 1); }).finally(redraw);

function shiftCard() {
  const today = me.today.date;
  if (!curDay) curDay = today;
  if (shiftCache[today] === undefined) shiftCache[today] = me.shift === undefined ? null : me.shift;
  let chips = '';
  for (let i = -DAYS_BACK; i <= DAYS_FWD; i++) {
    const d = addD(today, i), dt = new Date(d + 'T12:00:00Z');
    chips += `<button class="dchip ${d === today ? 'today' : ''} ${d === curDay ? 'on' : ''} ${dt.getUTCDay() === 1 && i !== -DAYS_BACK ? 'wk' : ''}" data-day="${d}"><small>${wdS[dt.getUTCDay()]}</small><b>${dt.getUTCDate()}</b></button>`;
  }
  return `<div class="card" id="shiftCard"><div class="dayhead">
      <button class="navb" id="dPrev">‹</button><div class="grow"><h2>На смене</h2><p class="sub" id="dTitle" style="margin:2px 0 0"></p></div><button class="navb" id="dNext">›</button></div>
    <div class="strip" id="strip">${chips}</div><div id="dayBody"></div>${me.isAdmin ? '<button class="btn soft" id="schRefresh" style="padding:10px;margin-top:10px;font-size:14px">🔄 Обновить график из таблицы</button>' : ''}</div>`;
}
function dayRows(date, list) {
  const today = me.today.date, isToday = date === today;
  if (list === undefined) return `<div class="wip">Загружаю…</div>`;
  if (list === null || (!list.length && date >= today)) return `<div class="wip"><div class="big">✍️</div><b>График в процессе</b>Расписание на этот день ещё не готово</div>`;
  if (!list.length) return `<div class="wip"><div class="big">🌙</div><b>Никого в графике</b></div>`;
  const now = me.now || 0, t = m => Math.floor(m / 60) % 24 + ':' + String(m % 60).padStart(2, '0');
  // сначала команда Рассвета, ниже отдельными блоками те, кто работает в другом месте (Узум, Яндекс, Amway, кейтеринг…)
  const pointRe = /яндекс|узум/i;
  const placeOf = x => x.place !== undefined ? x.place : ((String(x.name).match(pointRe) || [''])[0].replace(/^./, c => c.toUpperCase()));
  const bar = list.filter(x => !placeOf(x)), places = [];
  list.forEach(x => { const p = placeOf(x); if (p && places.indexOf(p) < 0) places.push(p); });
  const boss = p => /^(Управляющий|Владелец)$/.test(p);
  places.sort((p, q) => boss(q) - boss(p));   // руководство — сразу под командой Рассвета
  const row = x => {
    const cls = isToday && x.to ? (now >= x.from && now < x.to ? 'now' : now >= x.to ? 'past' : '') : '';
    const sub = !x.to ? 'на выезде' : isToday ? (cls === 'now' ? 'сейчас на смене' : cls === 'past' ? 'смена закончилась' : 'придёт в ' + t(x.from)) : (x.from < 12 * 60 ? 'утро' : 'вечер');
    const away = !!placeOf(x), shown = String(x.name).replace(pointRe, '').replace(/\s+/g, ' ').trim() || x.name;
    return `<div class="shift ${cls}">${avaHtml(shown)}
      <div class="pname"><b>${esc(shown)}${x.name === me.name ? ' <span class="mini">ты</span>' : ''}${homeData && (homeData.bdays || {})[x.name] === date.slice(5) ? ' 🎂' : ''}${stBadge(statusOf(x.name))}${x.role ? `<span class="mini">${esc(x.role)}</span>` : ''}${!away && x.to >= 22 * 60 ? '<span class="mini close">закрывает</span>' : ''}</b>
      <span>${sub}</span></div><span class="time">${x.word ? esc(x.word) : t(x.from) + ' – ' + t(x.to)}</span></div>`;
  };
  const n = bar.length;
  return (n ? `<p class="sub" style="margin:4px 0 0">Рассвет · ${n} ${n % 10 === 1 && n % 100 !== 11 ? 'человек' : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14) ? 'человека' : 'человек'} на смене</p>` + bar.map(row).join('') : '<p class="sub" style="margin:4px 0 0">Из команды Рассвета в графике никого</p>') +
    places.map(p => `<p class="sub" style="margin:14px 0 0">${boss(p) ? '👔' : '📍'} <b>${esc(p)}</b>${/^(Яндекс|Узум)$/.test(p) ? ' · офис на нашей точке' : ''}</p>` + list.filter(x => placeOf(x) === p).map(row).join('')).join('');
}
function drawDay(dir) {
  const body = document.getElementById('dayBody'); if (!body) return;
  const today = me.today.date, dt = new Date(curDay + 'T12:00:00Z'), diff = diffD(curDay, today);
  document.getElementById('dTitle').textContent = dt.toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' }) +
    (diff === 0 ? ' · сегодня' : diff === 1 ? ' · завтра' : diff === -1 ? ' · вчера' : '');
  document.getElementById('dPrev').disabled = diff <= -DAYS_BACK;
  document.getElementById('dNext').disabled = diff >= DAYS_FWD;
  document.querySelectorAll('.dchip').forEach(c => c.classList.toggle('on', c.dataset.day === curDay));
  const strip = document.getElementById('strip'), on = strip.querySelector('.dchip.on');
  if (on) strip.scrollTo({ left: on.offsetLeft - strip.offsetLeft - (strip.clientWidth - on.offsetWidth) / 2, behavior: dir ? 'smooth' : 'auto' });
  const paint = () => { if (document.getElementById('dayBody')) body.innerHTML = dayRows(curDay, shiftCache[curDay]); };
  const want = curDay;
  if (dir) { body.classList.add(dir > 0 ? 'out-l' : 'out-r'); setTimeout(() => { paint(); body.classList.remove('out-l', 'out-r'); }, 160); } else paint();
  if (shiftCache[curDay] === undefined) loadShift(curDay).then(() => { if (curDay === want) paint(); }).catch(() => { if (curDay === want) body.innerHTML = '<div class="wip">Не удалось загрузить</div>'; });
  [-1, 1, -2, 2].forEach(k => { const d = addD(curDay, k); if (Math.abs(diffD(d, today)) <= DAYS_BACK) loadShift(d).catch(() => {}); });
}
function goDay(n) {
  const nd = addD(curDay, n), diff = diffD(nd, me.today.date);
  if (diff < -DAYS_BACK || diff > DAYS_FWD) return;
  curDay = nd; drawDay(n);
  try { tg.HapticFeedback.selectionChanged(); } catch (e) {}
}
function bindShift() {
  if (!document.getElementById('shiftCard')) return;
  const sr = document.getElementById('schRefresh');
  if (sr) sr.onclick = async () => {
    sr.disabled = true; sr.textContent = 'Читаю таблицу…';
    try {
      await call('refreshSchedule');
      Object.keys(shiftCache).forEach(k => delete shiftCache[k]); Object.keys(shiftLoading).forEach(k => delete shiftLoading[k]);
      homeData = null; homeP = null; cfg = null; cfgP = null; names = null;
      me = await call('me'); toast('График обновлён ✅'); render();
    } catch (e) { toast(e.message); sr.disabled = false; sr.textContent = '🔄 Обновить график из таблицы'; }
  };
  document.getElementById('dPrev').onclick = () => goDay(-1);
  document.getElementById('dNext').onclick = () => goDay(1);
  document.querySelectorAll('.dchip').forEach(c => c.onclick = () => { const n = diffD(c.dataset.day, curDay); if (n) goDay(n); });
  const body = document.getElementById('dayBody');
  let x0 = null, y0 = null;
  body.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
  body.addEventListener('touchend', e => {
    if (x0 == null) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.3) goDay(dx < 0 ? 1 : -1);
  }, { passive: true });
  drawDay(0);
}

// Суммы: «200 000», «200000 сум», «200к», «1,5 млн»
const parseMoney = v => {
  const s = String(v == null ? '' : v).toLowerCase().replace(/сум|sum|\s/g, '').replace(',', '.');
  const m = s.match(/^(\d+(?:\.\d+)?)(к|k|т|тыс|млн|m)?$/);
  if (!m) return NaN;
  return Math.round(Number(m[1]) * (!m[2] ? 1 : /млн|m/.test(m[2]) ? 1e6 : 1e3));
};
const money = x => { x = Math.round(Number(x) || 0); return (x < 0 ? '−' : '') + String(Math.abs(x)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' сум'; };
let cashD = null;
let cashChk = null;   // проверка кассы перед закрытием: { res, first, why, note }
const dmy = d => d.slice(8, 10) + '.' + d.slice(5, 7);
function cashOpRow(o) {
  const t = new Date(o.at).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
  return `<div class="task" style="${o.canceled ? 'opacity:.5' : ''}"><div class="pname"><b style="${o.canceled ? 'text-decoration:line-through' : ''}">${o.kind === 'in' ? '+' : '−'}${esc(money(o.amount))} · ${esc(o.what)}</b>
    <span>${esc(o.srcLabel)} · ${esc(o.byName)} · ${t}${o.canceled ? ' · отменено' : o.edited ? ' · исправлено' : ''}${o.back ? ' · задним числом' : ''}</span></div>
    ${o.canEdit ? `<button class="tkbtn" data-cedit="${esc(o.id)}">✏️</button>` : ''}</div>`;
}
function cashHtml() {
  const d = cashD, out = [];
  out.push(card(`<h2>💵 Наличные</h2><p class="sub">Потратил из кассы или из конверта — сразу запиши сюда. Положил деньги в конверт — нажми «+ Внести»</p>

  if (d.env) {
    const e = d.env;
    out.push(card(`<h2>✉️ Конверт</h2>` + (e.known
      ? `<div style="font-size:30px;font-weight:700;margin:6px 0 0;white-space:nowrap">${esc(money(e.exp))}</div><p class="sub" style="margin:0">сейчас в конверте — по последнему пересчёту и записям</p><p class="sub" style="margin:8px 0 0">Пересчёт ${esc(dmy(e.baseDate))} (${esc(e.baseBy)}): ${esc(money(e.base))} · + внесения ${esc(money(e.ins))} · − расходы ${esc(money(e.exps))}</p>`
      : `<p class="sub">Пересчёта ещё не было — первый будет на закрытии смены, с него бот начнёт считать остаток.</p>`) +
      ''));

  const lbl = ['Сегодня', 'Вчера', 'Позавчера'];
  d.days.forEach((day, i) => {

    const live = ops.filter(o => !o.canceled), sum = f => live.filter(f).reduce((a, o) => a + o.amount, 0);
    const kx = sum(o => o.kind === 'exp' && o.src === 'kassa'), ex = sum(o => o.kind === 'exp' && o.src === 'env'), inn = sum(o => o.kind === 'in');

      : `<p class="sub">Записей пока нет</p>`)));

  return out.join('');

        : `<div class="check ${sel.has(i.pid) ? 'on' : ''}" ${ro ? 'style="cursor:default"' : `data-pid="${esc(i.pid)}"`}><div class="box">✓</div><div class="pname"><b>${esc(i.name)}</b><span>осталось ${fmt(i.have)} ${esc(i.unit)} · норма ${fmt(i.norm)}</span>${i.frozen > 0 ? `<span style="display:block;color:#3B5872;margin-top:2px">❄️ в морозилке ${fmt(i.frozen)} ${esc(i.unit)}</span><button class="tkbtn" data-thaw="${esc(i.pid)}" data-amt="${Math.min(i.need, i.frozen)}" style="margin-top:8px">❄️ Не варил, а разморозил</button>` : ''}
            <label class="yld"><em>Итоговый выход</em><span class="field"><input data-y="${esc(i.pid)}" inputmode="decimal" enterkeyhint="done" value="${esc(yv[i.pid] != null ? yv[i.pid] : fmt(i.need))}"><small>${esc(i.unit)}</small></span></label>${fzField(i.pid, i.unit)}</div><div class="pill">+${fmt(i.need)} ${esc(i.unit)}</div>${hasTk(i.pid) ? `<button class="tkbtn" data-tk="${esc(i.pid)}" data-amt="${i.need}">ТК</button>` : ''}</div>`).join('');
      const allDone = t.items.every(i => made[i.pid]);
      out += card(`<h2>Сварить сегодня</h2><p class="sub">${allDone ? 'Всё готово — спасибо! 🎉' : ro ? 'Что нужно сварить по последнему подсчёту' : 'Отметь, что сварил(а)'}</p>${rows}`);
    } else if (t.done && t.done.none) {
      out += empty('🌿', 'Сегодня варить не нужно', 'Всех заготовок хватает.');
    } else {
      out += empty(me.last ? '🌿' : '🌙', me.last ? 'Всего хватает' : 'Ещё нет подсчёта', me.last ? 'По подсчёту заготовки не нужны.' : 'Остатки внесут вечером на закрытии.');
    }
    if (ro) return out;
    // «Сварил что-то ещё» — заготовки не из списка (по подсчёту не требовались, но их сварили)
    const inList = {}; t.items.forEach(i => inList[i.pid] = 1);
    const extras = me.preps.filter(p => !inList[p.id]).map(p => ({ pid: p.id, name: p.name, unit: p.unit || '' }));
    const lastV = (me.last && me.last.values) || {};
    if (extras.length) {
      const open = extraOpen != null ? extraOpen : (!t.items.length || extras.some(x => sel.has(x.pid) || made[x.pid]));
      const madeCnt = extras.filter(x => made[x.pid]).length;
      const rowsX = extras.map(x => made[x.pid] ? madeRow(x)
        : `<div class="check ${sel.has(x.pid) ? 'on' : ''}" data-pid="${esc(x.pid)}"><div class="box">✓</div><div class="pname"><b>${esc(x.name)}</b><span>${lastV[x.pid] != null ? 'по подсчёту осталось ' + fmt(lastV[x.pid]) + ' ' + esc(x.unit) : 'не было в списке'}</span>
            <label class="yld"><em>Итоговый выход</em><span class="field"><input data-y="${esc(x.pid)}" inputmode="decimal" enterkeyhint="done" placeholder="0" value="${esc(yv[x.pid] != null ? yv[x.pid] : '')}"><small>${esc(x.unit)}</small></span></label>${fzField(x.pid, x.unit)}</div></div>`).join('');
      out += `<details class="card" id="extraBox" ${open ? 'open' : ''}><summary><div class="pname"><h2>${t.items.length ? 'Сварил что-то ещё?' : 'Сварил заготовку?'}</h2>
        <p class="sub">${madeCnt ? 'Отмечено сверх списка: ' + madeCnt : 'Отметь, если сварил(а) то, чего не было в списке'}</p></div></summary>${rowsX}</details>`;
    }
    const pending = t.items.some(i => !made[i.pid]), canMore = extras.some(x => !made[x.pid]);
    if (!pending && !canMore) return out;
    // если список сварен, кнопка появляется только когда что-то выбрали в «Сварил что-то ещё»
    out += `<div class="dock ${pending || sel.size ? '' : 'hide'}" id="madeDock"><button class="btn ok" id="made" ${sel.size ? '' : 'disabled'}>${sel.size ? '✅ Отметить сваренное (' + sel.size + ')' : 'Выбери, что сварил(а)'}</button></div>`;
    return out;
  },

  async fridge() {
    if (!fridgeData) fridgeData = await call('fridge');
    const d = fridgeData, now = Date.now(), ed = d.canEdit;
    const pl = (n, a, b, c) => { const m = n % 10, h = n % 100; return h > 10 && h < 20 ? c : m === 1 ? a : m > 1 && m < 5 ? b : c; };
    const badge = x => {
      if (!x.exp) return '<span class="days">срок не указан</span>';
      const L = (x.exp - now) / 864e5;
      if (L < 0) return '<span class="days today">срок истёк</span>';
      const n = Math.ceil(L);
      if (x.state === 'f') return `<span class="days frz">❄️ ${n} ${pl(n, 'день', 'дня', 'дней')}</span>`;
      return `<span class="days ${n <= 1 ? 'today' : n <= 2 ? 'soon' : ''}">${n <= 1 ? 'последний день' : 'ещё ' + n + ' ' + pl(n, 'день', 'дня', 'дней')}</span>`;
    };
    const dd = ts => new Date(ts).toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
    const row = x => `<div class="batch"><div class="pname"><b>${esc(x.name)}${x.state === 'f' ? ' · ' + fmt(x.q) + ' ' + esc(x.unit) : ''}</b><span>${esc(dd(x.made))} · ${x.state === 'f' ? 'заморозил(а)' : x.thaw ? 'разморозил(а)' : x.cnt ? 'завёл(а) на закрытии' : 'сварил(а)'} ${x.by ? esc(x.by) : '—'}${x.q0 && !(x.state === 'f' && Math.abs(x.q0 - x.q) < 0.001) ? ' · ' + (x.state === 'f' ? 'было ' : '') + fmt(x.q0) + ' ' + esc(x.unit) : ''}${x.state !== 'f' && (!x.q0 || Math.abs(x.q0 - x.q) > 0.001) ? ' · осталось ' + fmt(x.q) + ' ' + esc(x.unit) : ''}${x.ext ? ' · продлевали ' + x.ext + ' р.' : ''}</span>${x.mark ? `<span style="color:var(--danger)">🏷 Не промаркирована</span>` : ''}
        ${ed ? `<div class="acts" style="margin-top:8px">${x.state === 'f'
          ? `${x.mark ? `<button class="tkbtn" data-bmark="${esc(x.id)}">🏷 Промаркировал(а)</button>` : ''}<button class="tkbtn" data-bthaw="${esc(x.pid)}">❄️ Разморозить</button><button class="tkbtn" data-bused="${esc(x.id)}">Закончилась</button><button class="tkbtn" data-bwaste="${esc(x.id)}" style="background:var(--warm-soft);color:var(--danger)">🗑 Списать</button>`
          : `${x.mark ? `<button class="tkbtn" data-bmark="${esc(x.id)}">🏷 Промаркировал(а)</button>` : ''}${x.exp && x.exp < now ? (x.aliveBlock ? `<span class="sub" style="width:100%">${x.aliveBlock === 'limit' ? 'Продлили 3 раза: дальше решает управляющий' : 'Сегодня уже продлили, следующий раз завтра'}</span>` : `<button class="tkbtn" data-balive="${esc(x.id)}">👌 Ещё живая</button>`) : ''}<button class="tkbtn" data-bused="${esc(x.id)}">Закончилась</button><button class="tkbtn" data-bwaste="${esc(x.id)}" style="background:var(--warm-soft);color:var(--danger)">🗑 Списать</button>`}</div>` : ''}</div>${badge(x)}</div>`;
    const work = d.batches.filter(x => x.state === 'w'), frozen = d.batches.filter(x => x.state === 'f');
    let out = card(`<h2>🧊 В работе</h2><p class="sub">${work.length ? 'Сверху — то, что истекает раньше. Срок вышел, а заготовка ещё живая — жми «👌 Ещё живая», проверим завтра. Партии от этой даты нет — «Закончилась»' : 'Партии появятся, когда сотрудники отметят сваренные заготовки'}</p>${work.map(row).join('')}`);
    if (d.frz.length || frozen.length) {
      out += card(`<h2>❄️ В морозилке</h2><p class="sub">${frozen.length ? 'Срок хранения после разморозки считается с дня разморозки' : 'Пока пусто'}</p>${frozen.map(row).join('')}` +
        (ed ? d.frz.map(p => `<button class="btn soft" data-bfreeze="${esc(p.id)}" style="padding:11px">＋ Положить в морозилку: ${esc(p.name)}</button>`).join('') : ''));
    }
    const offs = d.autoOff || [];
    if (offs.length) {
      out += card(`<h2>🗑 Списано ботом</h2><p class="sub">Просрочку до 16:00 никто не проверил, и бот списал её сам. Заготовку не выбросили и она ещё живая — жми «↩️ Вернуть», партия вернётся и уйдёт из отчёта списаний</p>` +
        offs.map(x => `<div class="batch"><div class="pname"><b>${esc(x.name)} · ${fmt(x.q)} ${esc(x.unit)}</b><span>от ${esc(dd(x.made))} · вернуть можно до конца ${esc(dd(x.till))}</span>
          ${ed ? `<div class="acts" style="margin-top:8px"><button class="tkbtn" data-bret="${esc(x.id)}">↩️ Вернуть</button></div>` : ''}</div></div>`).join(''));
    }
    return out;
  },

  async preps() {
    await getCfg();
    let cards = [];
    try { cards = await getTk(); } catch (e) {}
    const stem = w => norm2(w).slice(0, 4);

      ${rows || ''}<button class="btn soft" id="add">+ Добавить заготовку</button>`) +
      card(`<h2>Чек-лист закрытия</h2><p class="sub">Пункты, которые отмечают на закрытии смены</p><div id="cl">` +
        cl.map((t, k) => `<div class="cl-row edit" style="padding:8px;margin-bottom:8px"><input data-cl value="${esc(t)}" placeholder="Например: почистить кофемашину"><button class="x" data-cldel="${k}">×</button></div>`).join('') +
        `</div><button class="btn soft" id="cladd">+ Добавить пункт</button><button class="btn" id="clsave">Сохранить чек-лист</button>`) +
      `<div class="dock"><button class="btn" id="save">Сохранить заготовки</button></div>`;
  },

  async grafik() {
    grD = grD || await call('grafik');
    const d = grD, r = d.req;
    const dayS = s => new Date(s + 'T12:00:00Z').toLocaleDateString('ru-RU', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' });
    const dmS = s => s.slice(8, 10) + '.' + s.slice(5, 7);
    const range = (a, b) => { const out = []; for (let x = a; x <= b && out.length < 40; x = addD(x, 1)) out.push(x); return out; };
    let out = '';
    // сотрудник: отметить желаемые выходные
    const pv = d.isAdmin && grPrev;   // админ смотрит, как видят сотрудники
    if (pv || (r && r.open && (d.inList || !d.isAdmin))) {
      const rr = pv ? grPrev : r, mineD = pv ? null : d.mine, days = pv ? grPrev.days : d.days;
      if (!grSel) { grSel = new Set((mineD && mineD.d) || []); }
      // список дней: день недели и число, сколько ещё можно взять выходных, кнопка «Выходной»
      // 🌴 мой выходной · 🔒 мест нет (можно заявление) · ⏳ заявление ждёт · ✅ заявление одобрено
      const info = x => (days || []).find(y => y.date === x) || { free: true, left: null, z: '' };
      const wdL = s => new Date(s + 'T12:00:00Z').toLocaleDateString('ru-RU', { weekday: 'long', timeZone: 'UTC' });
      const dnL = s => new Date(s + 'T12:00:00Z').toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', timeZone: 'UTC' });
      const places = n => n + ' ' + (n % 10 === 1 && n % 100 !== 11 ? 'место' : [2, 3, 4].indexOf(n % 10) >= 0 && (n % 100 < 12 || n % 100 > 14) ? 'места' : 'мест');
      const chips = range(rr.from, rr.to).filter(x => pv || !d.maxOff || d.maxOff >= 3 || (days || []).some(y => y.date === x)).map(x => {
        const i = info(x), mine = grSel.has(x), left = i.left == null ? null : Math.max(0, i.left - (mine ? 1 : 0));
        let btn;
        if (!mine && (i.z === 'ok' || i.z === 'wait')) btn = `<button class="grbtn ${i.z === 'ok' ? 'on' : 'busy'}" data-grz-st="${i.z}">${i.z === 'ok' ? '✅ Одобрено' : '⏳ Заявление'}</button>`;
        else if (!mine && !i.free) btn = `<button class="grbtn busy" data-grbusy="${x}">🔒 Занято</button>`;
        else btn = `<button class="grbtn ${mine ? 'on' : ''}" data-grday="${x}">${mine ? '🌴 Выходной' : 'Выходной'}</button>`;
        const sub = left == null ? '' : !mine && !i.free ? 'мест нет — можно заявление' : left ? 'ещё можно: ' + places(left) : 'мест больше нет';
        return `<div class="grrow${mine ? ' on' : ''}"><div class="grday"><b>${esc(wdL(x))}</b><span>${esc(dnL(x))}${sub ? ' · ' + sub : ''}</span></div>${btn}</div>`;
      }).join('');
      const zForm = grZ ? card(`<h2>📝 Заявление на выходной</h2><p class="sub">${esc(dayS(grZ))} уже занят — в один день могут отдыхать не все, иначе некому работать. Если очень нужно — напиши причину, админ решит и бот пришлёт ответ</p>
        <div class="form"><textarea id="grZr" rows="3" maxlength="300" placeholder="Например: запись к врачу, экзамен"></textarea></div>
        <div class="two"><button class="btn" id="grZSend">Отправить админу</button><button class="btn soft" id="grZNo">Отмена</button></div>`) : '';
      out += card(`${pv ? '<p class="sub" style="margin:0 0 8px;color:var(--warm)">👀 Предпросмотр — так увидят сотрудники. Нажимать можно, но ничего не сохранится</p>' : ''}<h2>🗓 Желаемые выходные</h2><p class="sub">График на ${dmS(rr.from)}–${dmS(rr.to)}. ${!pv && d.maxOff === 2 ? 'Обычно ты выходишь в субботу и воскресенье. Если нужен выходной — отметь один или оба дня' : 'Отметь дни, когда хочешь отдыхать'}, до <b>${esc(rr.dlText)}</b> — бот постарается учесть. В один день могут отдыхать не все: если мест нет (🔒), можно подать заявление</p>
        <div class="grlist2">${chips}</div>
        <div class="form"><label>Комментарий для админа (необязательно)<textarea id="grNote" rows="2" maxlength="300" placeholder="Например: в пятницу могу только с 16:00">${esc(grForm.note != null ? grForm.note : (mineD && mineD.note) || '')}</textarea></label></div>
        <button class="btn" id="${pv ? 'grPrevSave' : 'grSave'}">${mineD && mineD.done ? 'Сохранить изменения' : 'Сохранить'}</button>
        ${pv ? '<button class="btn soft" id="grPrevOff">Закрыть предпросмотр</button>' : ''}
        ${mineD && mineD.done ? `<p class="sub" style="margin-top:10px">✅ Записано: ${mineD.d.length ? mineD.d.map(dmS).join(', ') : 'без пожеланий'}</p>` : ''}`) + zForm +
        (pv ? '' : card(grVac ? `<h2>🤒 Отпуск / больничный</h2><p class="sub">Выбери, что и с какого по какое число. Админ подтвердит — бот впишет в график и не поставит тебя на смены</p>
          <div class="two"><button class="grbtn ${grVac.t === 'o' ? 'on' : ''}" data-grvt="o">🏖 Отпуск</button><button class="grbtn ${grVac.t === 'b' ? 'on' : ''}" data-grvt="b">🤒 Больничный</button></div>
          <div class="form two"><label>С<input type="date" id="grVFrom" value="${esc(grVac.from || '')}"></label><label>По<input type="date" id="grVTo" value="${esc(grVac.to || '')}"></label></div>
          <div class="two"><button class="btn" id="grVSend">Отправить админу</button><button class="btn soft" id="grVNo">Отмена</button></div>`
          : `<button class="btn soft" id="grVOpen">🤒 Я в отпуске / на больничном</button>`));
    } else if (r && !r.open && !d.isAdmin) out += empty('🗓', 'Сбор выходных закончен', `Пожелания на ${dmS(r.from)}–${dmS(r.to)} собраны — скоро будет график`);
    else if (!d.isAdmin) out += empty('🗓', 'Сейчас сбор выходных не идёт', 'Когда админ начнёт составлять график, бот пришлёт сообщение — отметишь дни здесь или кнопками в чате');
    if (!d.isAdmin) return out;
    if (!d.canEdit) out += `<p class="sub" style="margin:0 0 8px">👀 График — только просмотр: составляет и меняет админ</p>`;
    // админ: по дням — сколько выходных занято (из скольки можно) и кто взял
    if (r) {
      const wdL = s => new Date(s + 'T12:00:00Z').toLocaleDateString('ru-RU', { weekday: 'long', timeZone: 'UTC' });
      const dnL = s => new Date(s + 'T12:00:00Z').toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', timeZone: 'UTC' });
      const rows = (d.days || []).map(x => { const n = (x.names || []).length, full = x.cap != null && n >= x.cap;
        return `<div class="grrow"><div class="grday"><b>${esc(wdL(x.date))}</b><span>${esc(dnL(x.date))}${n ? ' · 🌴 ' + esc(x.names.join(', ')) : ''}</span></div><span class="grbtn ${full ? 'on' : ''}">${n}${x.cap != null ? ' из ' + x.cap : ''}</span></div>`; }).join('');
      const zl = (d.answers || []).flatMap(w => (w.z || []).map(z => `<br>📝 ${esc(w.name)}, ${dmS(z.date)}: ${z.st === 'ok' ? '✅ одобрено' : z.st === 'no' ? '❌ отказано' : '⏳ ждёт решения'} — «${esc(z.r)}»`)).join('');
      out += card(`<h2>🗓 Выходные ${dmS(r.from)}–${dmS(r.to)}</h2><p class="sub">${r.open ? 'Сбор идёт до ' + esc(r.dlText) + ', потом бот сам составит график и внесёт в таблицу' : r.done ? 'Сбор закрыт тобой — бот график не пересоставляет' : 'Сбор закончен'}. Справа — сколько выходных взяли из скольки можно</p>
        <div class="grlist2">${rows}</div>
        ${(d.wait || []).length ? `<p class="sub" style="margin-top:10px">Ещё не ответили: ${esc(d.wait.join(', '))}</p>` : ''}${zl ? `<p class="sub" style="margin-top:6px">Заявления:${zl}</p>` : ''}
        ${r.open && !d.job && d.canEdit ? `<p class="sub" style="margin-top:10px">Не хочешь ждать — составь по тем выходным, что уже отметили. Сбор не закроется: кто не ответил — 5/2, отмечать можно до ${esc(r.dlText)}. Тогда бот сам пересоставит с новыми выходными, а раньше — нажми ещё раз</p>
          <button class="btn" id="grNowBtn">${d.draft && d.draft.from === r.from && d.draft.status === 'done' ? '🔄 Пересоставить с новыми выходными' : '🧩 Составить график сейчас'}</button>
          <p class="sub" style="margin-top:12px">График уже готов (ботом или руками в таблице)? Закрой сбор — тогда в ${esc(r.dlText)} бот ничего не пересоставит</p>
          <button class="btn soft" id="grDoneBtn">✅ График готов, закрыть сбор</button>` : ''}`);
    } else out += empty('🗓', 'Сбор выходных сейчас не идёт', 'Каждую пятницу в 12:00 бот сам открывает сбор на следующую неделю (до субботы 18:00), потом сам составляет график и вносит в таблицу');
    // админ: начать сбор на следующую неделю раньше пятницы
    const nx = d.next;

    else if (dr) {
      const st = { done: '✅ внесён в лист «' + dr.month + '»', new: 'ждёт решения', approved: '✅ утверждён — перенесён в лист «' + dr.month + '»', manual: '✍️ оставлен — правишь сам' }[dr.status] || dr.status;

        ${dr.wishes ? `<p class="sub">🌴 Желаемые выходные: учтено ${dr.wishOk} из ${dr.wishes}</p>` : ''}

        ${dr.issues.length ? `<h3>⚠️ Не сходится с правилами (${dr.issues.length})</h3><ul class="grlist">${dr.issues.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '<p class="sub">✅ Все правила соблюдены</p>'}
        ${(dr.urls || [{ sheet: dr.sheet, url: dr.url }]).map(u => `<button class="btn soft" data-grurl="${esc(u.url)}">📄 Открыть «${esc(u.sheet)}»</button>`).join('')}
        ${dr.status === 'new' && d.canEdit ? `<div class="two"><button class="btn" id="grApprove">✅ Утвердить</button><button class="btn soft" id="grManual">✍️ Поправлю сам</button></div>` : ''}
        ${dr.status === 'done' ? `<p class="sub" style="margin-top:10px">${dr.sent > 0 ? '📤 Команде разослан ' + esc(new Date(dr.sent).toLocaleString('ru-RU', { day: 'numeric', month: 'numeric', hour: '2-digit', minute: '2-digit' })) : '📤 ' + esc(dr.sendNote || '')}</p>
          ${d.canEdit ? `<div class="two"><button class="btn" id="grSend">📤 ${dr.sent > 0 ? 'Разослать ещё раз' : 'Разослать команде'}</button><button class="btn soft" id="grRegen">🔄 Пересоставить</button></div>` : ''}` : ''}`);
    }
    return out;
  },
  async history() {
    if (!hist) hist = (await call('history')).items;
    const rep = me.isAdmin ? card(`<h2>🏆 Итоги 2 недель</h2><p class="sub">Рейтинг, кто сколько заготовок сварил. Приходит в группу сам раз в 2 недели в понедельник в 12:00</p><button class="btn soft" id="reportNow">Отправить итоги сейчас</button><button class="btn soft" id="weekNow" style="margin-top:8px">📊 Сводка недели мне в личку</button><button class="btn soft" id="briefNow" style="margin-top:8px">☀️ Утренний брифинг мне в личку</button>`) : '';
    if (!hist.length) return rep + empty('📜', 'Закрытий пока нет', 'Здесь появится история каждого закрытия смены.');
    const day = d => new Date(d + 'T12:00').toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', weekday: 'short' });
    return rep + card(`<h2>История закрытий</h2><p class="sub">Последние 7 дней. Нажми, чтобы посмотреть подробно</p>`) +
      hist.map((x, k) => {
        const c = x.checks, okAll = c && c.done === c.total;
        return `<div class="card hcard" data-h="${k}"><div style="display:flex;align-items:center;gap:12px">
          <div class="pname"><b style="font-size:17px">${esc(day(x.date))}</b><span>${esc(x.by)} · ${new Date(x.ts).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' })}</span></div>
          <span style="color:var(--muted);font-size:22px">›</span></div>
          <div class="hmeta">
            ${c ? `<span class="badge" style="${okAll ? '' : 'background:var(--warm-soft);color:var(--warm)'}">чек-лист ${c.done}/${c.total}</span>` : ''}
            <span class="badge">📷 ${(x.photos || []).length}</span>
            <span class="badge">остатки: ${Object.keys(x.values || {}).length}</span>
          </div></div>`;
      }).join('');
  }
};

  count() {

    // подсказка: что уже записано из кассы через «Наличные» (бот вычтет это из остатка iiko)
    const cashHint = () => {

    const drawChk = () => {

        r.hint.ops.map(o => `<div style="font-size:14px;margin:2px 0">${o.near ? '👉 <b>' : '• '}${esc(money(o.a))} — ${esc(o.what)}${o.near ? '</b>' : ''}${o.by ? ' · <i>' + esc(o.by) + '</i>' : ''}</div>`).join('') : '';
      const fixBtns = `<div class="chips" style="margin-top:8px"><button class="chip" id="chkExp">− Забытый расход</button><button class="chip" id="chkIn">+ Внесение в конверт</button></div>`;

      box.querySelector('#chkIn').onclick = () => openF('in', { from: r.kd > r.tol || (r.kd < -r.tol && r.ed > r.tol) ? 'kassa' : '' });

    const chkDone = () => !!(cashChk && cashChk.s1 && cashChk.s2 && (cashChk.note || '').trim().length >= ((cashChk.res && cashChk.res.noteMin) || 15) && (cashChk.note || '').trim().split(/\s+/).length >= 2);
    const cashNow = () => ({ ik: cashVal('ik'), cf: cashVal('cf'), env: cashVal('env') });
    // true — можно закрывать

      if (!cashChk) cashChk = { first: { kd: r.kd, ed: r.ed }, s1: false, s2: false, note: '' };

    cashIn.forEach(i => i.oninput = () => { draft['$' + i.dataset.cash] = i.value; saveDraft(); cashHint(); if (cashChk) { cashChk.res = null; drawChk(); } syncBtn(); });
    cashHint();
    drawChk();
    // что ещё мешает закрыть смену
    const MIN_PH = 3;
    const missing = () => {
      const m = [], cMiss = cl.length - checks.size, ph = photos.filter(p => p.id).length;

      return m;
    };
    const syncBtn = () => {

    document.querySelectorAll('[data-offok]').forEach(b => b.onclick = () => offDone(() => call('autoOffOk', { id: b.dataset.offok }), 'Отмечено: вылили 🗑'));
    document.querySelectorAll('[data-offret]').forEach(b => b.onclick = async () => {

      if (!(await confirmBox(`Вернуть ${x.name} (${fmt(x.q)} ${x.unit})? Партия вернётся в холодильник и уйдёт из отчёта списаний.`))) return;

    btn.onclick = async () => {

      const values = {}; let emptyN = 0, bad = 0;

      if (!(await fixBig(chk))) { haptic('error'); return; }

      if (photos.some(p => p.loading)) { toast('Подожди, фото ещё загружаются…'); return; }

      b.disabled = true;

    const xb = document.getElementById('extraBox');
    if (xb) xb.addEventListener('toggle', () => { extraOpen = xb.open; });
    const btn = document.getElementById('made'); if (!btn) return;
    const dock = document.getElementById('madeDock'), pending = me.today.items.some(i => !(me.today.made || {})[i.pid]);
    const sync = () => {
      btn.disabled = !sel.size; btn.textContent = sel.size ? '✅ Отметить сваренное (' + sel.size + ')' : 'Выбери, что сварил(а)';

    };
    document.querySelectorAll('[data-pid]').forEach(el => el.onclick = e => {
      if (e.target.closest('.yld')) return;   // клик по полю выхода не снимает выбор

      if (sel.has(id)) { const inp = el.querySelector('[data-y]'); if (inp) setTimeout(() => { inp.focus(); inp.select(); }, 50); }

    btn.onclick = async () => {
