    ['grFrom', 'grTo', 'grDl'].forEach((id, i) => { const el = document.getElementById(id); if (el) el.onchange = () => { grForm[['from', 'to', 'deadline'][i]] = el.value; }; });
    const st = document.getElementById('grStart');
    if (st) st.onclick = async () => {
      if (!(await confirmBox('Разослать команде просьбу отметить желаемые выходные?'))) return;
      act(st, 'grStart', { from: v('grFrom'), to: v('grTo'), deadline: v('grDl') }, 'Разослал команде 📨');
    };
    const nb = document.getElementById('grNowBtn');
    if (nb) nb.onclick = async () => { if (await confirmBox('Составить график по уже отмеченным выходным? Сбор не закроется')) act(nb, 'grGenNow', {}); };
    const db = document.getElementById('grDoneBtn');
    if (db) db.onclick = async () => { if (await confirmBox('Закрыть сбор выходных? Отмечать больше нельзя, и в субботу бот график не пересоставит')) act(db, 'grDone', {}); };
    const sn = document.getElementById('grStartNext');
    if (sn) sn.onclick = async () => {
      const nx = grD.next || {};
      if (!(await confirmBox(`Начать сбор выходных на ${nx.from ? nx.from.slice(8, 10) + '.' + nx.from.slice(5, 7) : ''}–${nx.to ? nx.to.slice(8, 10) + '.' + nx.to.slice(5, 7) : ''}? Бот сразу напишет всей команде`))) return;
      act(sn, 'grStartNext', {});
    };
    const gn = document.getElementById('grGenNow'); if (gn) gn.onclick = () => act(gn, 'grGen', { from: v('grFrom'), to: v('grTo') }, 'Составляю — пришлю в бот через пару минут ⏳');
  },
  history() {
    const bb = document.getElementById('briefNow');
    if (bb) bb.onclick = async () => { bb.disabled = true; try { await call('briefNow'); toast('Брифинг отправлен тебе в личку ☀️'); } catch (e) { toast(e.message); } bb.disabled = false; };
    const wb = document.getElementById('weekNow');
    if (wb) wb.onclick = async () => { wb.disabled = true; try { await call('weekNow'); toast('Сводка отправлена тебе в личку 📊'); } catch (e) { toast(e.message); } wb.disabled = false; };
    const rb = document.getElementById('reportNow');
    if (rb) rb.onclick = async () => {
      if (!(await confirmBox('Отправить в группу итоги заготовок за последние 2 недели?'))) return;
      rb.disabled = true;
      try { await call('reportNow'); haptic('success'); toast('Итоги отправлены в группу 🏆'); } catch (e) { toast(e.message); }
      rb.disabled = false;
    };
    document.querySelectorAll('[data-h]').forEach(el => el.onclick = () => openClosing(hist[+el.dataset.h]));
  },
  tk() {
    const rf = document.getElementById('tkRefresh');
    if (rf) rf.onclick = async () => {
      rf.disabled = true; rf.textContent = 'Читаю таблицу…';
      try { tkCards = (await call('tk', { refresh: true })).cards; tkP = null; toast('Техкарты обновлены ✅'); render(); }
      catch (e) { toast(e.message); rf.disabled = false; rf.textContent = '🔄 Обновить из таблицы'; }
    };
    document.querySelectorAll('[data-hide]').forEach(b => b.onclick = async e => {
      e.stopPropagation();
      const hide = b.dataset.val === '1', c = tkCards.find(x => x.id === b.dataset.hide);
      if (hide && !(await confirmBox(`Убрать «${c ? c.title : ''}» из приложения? В таблице техкарта останется.`))) return;
      b.disabled = true;
      try { await call('tkHide', { id: b.dataset.hide, hidden: hide }); if (c) c.hidden = hide; haptic('success'); render(); }
      catch (err) { toast(err.message); b.disabled = false; }
    });
    document.querySelectorAll('[data-card]').forEach(el => el.onclick = () => {
      const c = tkCards.find(x => x.id === el.dataset.card); if (!c) return;
      const p = me.preps.find(x => x.tk === c.id);
      openTk(c, p, null);
    });
  }
};

// ===== РЕГЛАМЕНТ: документы из Google Docs, поиск по тексту =====
let regsData = null, regsQ = '';
function regHtml(text, q) {
  const hl = s => { let h = esc(s); if (q) h = h.replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), m => `<mark>${m}</mark>`); return h; };
  return text.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
    if (/^[*•\-]\s+/.test(l)) return `<li>${hl(l.replace(/^[*•\-]\s+/, ''))}</li>`;
    if (l.length < 90 && /^(☐\s*)?\d+(\.\d+)*\.?\s+\S/.test(l) && !/[.;:]$/.test(l)) return `<h3>${hl(l)}</h3>`;
    return `<p>${hl(l)}</p>`;
  }).join('');
}
function regsList() {
  const q = regsQ.trim().toLowerCase(), docs = (regsData || []).filter(x => !q || (x.title + '\n' + x.text).toLowerCase().indexOf(q) >= 0);
  if (!docs.length) return '<p class="sub">Ничего не нашёл</p>';
  return docs.map(x => `<details class="reg" ${q ? 'open' : ''}><summary>${esc(x.title)}</summary><div class="rt">${x.err ? `<p style="color:var(--danger)">${esc(x.err)}</p>` : regHtml(x.text, q)}</div></details>`).join('');
}
views.regs = async function () {
  if (!regsData) regsData = (await call('regs')).docs;
  return card(`<h2>📜 Регламент</h2><p class="sub">Правила бара. Тексты берутся из Google-документов — если их поправят, здесь обновится само.</p>
    <div class="form"><input id="regQ" type="search" placeholder="🔍 Поиск по регламентам" value="${esc(regsQ)}"></div>
    ${me.isAdmin ? `<button class="btn soft" id="regRefresh" style="margin:8px 0 0;padding:11px">🔄 Обновить из документов</button>` : ''}
    <div id="regList" style="margin-top:6px">${regsList()}</div>`);
};
binds.regs = function () {
  const qi = document.getElementById('regQ'), box = document.getElementById('regList');
  if (qi) qi.oninput = () => { regsQ = qi.value; box.innerHTML = regsList(); };
  const rf = document.getElementById('regRefresh');
  if (rf) rf.onclick = async () => {
    rf.disabled = true; rf.textContent = 'Читаю документы…';
    try { regsData = (await call('regs', { fresh: true })).docs; toast('Регламенты обновлены ✅'); render(); }
    catch (e) { toast(e.message); rf.disabled = false; rf.textContent = '🔄 Обновить из документов'; }
  };
};

// ===== ПЕРЕДАЧА СКЛАДА: утро сдаёт по чек-листу, вечер принимает =====
const tm = ts => new Date(ts).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Tashkent' });
function skCard() {
  const k = me.sk; if (!k) return '';
  const s = k.s, acc = s && s.acc;
  const sum = s ? `<p class="sub">Сдал(а) <b>${esc(s.by)}</b> в ${tm(s.at)} · ${s.miss.length ? '⚠️ не в порядке: ' + s.miss.map(esc).join(', ') : '✅ все пункты в порядке'}${s.note ? '<br>💬 ' + esc(s.note) : ''}</p>` : '';
  const accLine = acc ? `<div class="status" style="${acc.note ? 'background:var(--warm-soft);color:var(--warm)' : ''}"><span class="big">${acc.note ? '⚠️' : '✅'}</span>Принял(а) ${esc(acc.by)} в ${tm(acc.at)}${acc.note ? ': ' + esc(acc.note) : ''}</div>` : '';
  if (k.role === 'give' && !s) return card(`<h2>📦 Передача склада</h2><p class="sub">Перед уходом пройди чек-лист уборки склада и сдай склад вечерней смене${k.take.length ? ' (' + k.take.map(esc).join(', ') + ')' : ''}. Что не в порядке — не отмечай.</p>` +
    k.items.map((it, i) => `<div class="check" data-sk="${i}"><div class="box">✓</div><div><b>${esc(it.t)}</b>${it.d ? `<span class="skd">${esc(it.d)}</span>` : ''}</div></div>`).join('') +
    `<div class="form"><textarea id="skNote" rows="2" placeholder="Комментарий для вечерней смены (необязательно)"></textarea></div><button class="btn" id="skGive">📦 Сдать склад</button>`);
  if (k.role === 'take' && !s) return card(`<h2>📦 Передача склада</h2><p class="sub">Утренняя смена${k.give.length ? ' (' + k.give.map(esc).join(', ') + ')' : ''} ещё не сдала склад. Как сдаст — придёт сообщение.</p>`);
  if (k.role === 'take' && !acc) return card(`<h2>📦 Приём склада</h2>${sum}<p class="sub">Проверь склад и подтверди.</p>
    <button class="btn" id="skOk">✅ Принял(а)</button><button class="btn soft" id="skBad">⚠️ Есть замечания</button>`);
  return card(`<h2>📦 Передача склада</h2>${sum}${accLine || (s ? '<p class="sub">Вечерняя смена ещё не подтвердила.</p>' : '')}`);
}
function bindSk() {
  const k = me.sk; if (!k) return;
  document.querySelectorAll('[data-sk]').forEach(el => el.onclick = () => el.classList.toggle('on'));
  const reload = async () => { me = await call('me'); render(); };
  const g = document.getElementById('skGive');
  if (g) g.onclick = async () => {
    const checks = [...document.querySelectorAll('[data-sk].on')].map(el => +el.dataset.sk), miss = k.items.length - checks.length;
    if (miss && !(await confirmBox(`Не отмечено пунктов: ${miss}. Сдать склад с пометкой «не в порядке»?`))) return;
    g.disabled = true; g.textContent = 'Отправляю…';
    try { await call('skGive', { checks: checks, note: document.getElementById('skNote').value }); haptic('success'); toast('Склад сдан — вечерняя смена получила сообщение ✅'); await reload(); }
    catch (e) { toast(e.message); g.disabled = false; g.textContent = '📦 Сдать склад'; }
  };
  const ok = document.getElementById('skOk');
  if (ok) ok.onclick = async () => { ok.disabled = true; try { toast((await call('skAcc', { ok: true })).msg); haptic('success'); await reload(); } catch (e) { toast(e.message); ok.disabled = false; } };
  const bad = document.getElementById('skBad');
  if (bad) bad.onclick = () => {
    closeSheet();
    const wrap = document.createElement('div'); wrap.className = 'sheet-bg'; wrap.id = 'sheet';
    wrap.innerHTML = `<div class="sheet"><div class="grab"></div><h2>⚠️ Что не в порядке?</h2><p class="sub" style="margin-top:4px">Передам управляющему и утренней смене.</p>
      <div class="form"><textarea id="skBadT" rows="3" placeholder="Например: морозильник грязный, коробки в проходе"></textarea></div>
      <button class="btn" id="skBadSend">Отправить</button><button class="btn soft" id="closeSheet">Отмена</button></div>`;
    document.body.appendChild(wrap);
    wrap.querySelector('#closeSheet').onclick = closeSheet;
    wrap.onclick = e => { if (e.target === wrap) closeSheet(); };
    const b = wrap.querySelector('#skBadSend');
    b.onclick = async () => {
      const note = wrap.querySelector('#skBadT').value.trim(); if (!note) return toast('Напиши, что не так');
      b.disabled = true;
      try { toast((await call('skAcc', { ok: false, note: note })).msg); closeSheet(); await reload(); } catch (e) { toast(e.message); b.disabled = false; }
    };
  };
}

// ---- клавиатура: «Готово», тап мимо поля, Enter → следующее поле ----
function initKeyboard() {
  const isField = el => !!el && ((el.tagName === 'INPUT' && !/^(checkbox|radio|file|button|submit|date|time)$/.test(el.type)) || el.tagName === 'TEXTAREA');
  const hide = () => { const a = document.activeElement; if (isField(a)) a.blur(); };
  // тап по пустому месту закрывает клавиатуру
  let sx = 0, sy = 0;
  document.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  document.addEventListener('touchend', e => {
    if (!isField(document.activeElement)) return;
    const t = e.target, c = e.changedTouches[0];
    if (Math.abs(c.clientX - sx) > 10 || Math.abs(c.clientY - sy) > 10) return;   // это был скролл
    if (isField(t) || (t.closest && t.closest('label,select,button,.field'))) return;
    hide();
  }, { passive: true });
  // Enter: в подсчёте — к следующему полю, иначе закрыть клавиатуру
  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter' || e.target.tagName !== 'INPUT') return;
    e.preventDefault();
    const list = [...document.querySelectorAll('input[data-id],input[data-oid],input[data-ing]')].filter(i => !i.disabled);
    const i = list.indexOf(e.target);
    if (i >= 0 && list[i + 1]) { list[i + 1].focus(); list[i + 1].select && list[i + 1].select(); } else hide();
  });
}

// ---- обновление свайпом вниз ----
async function refreshAll() {
  taskData = evData = homeData = hist = cfg = tkCards = null; cfgP = tkP = null;
  fridgeData = bkData = cardData = null;
  Object.keys(shiftCache).forEach(k => delete shiftCache[k]); Object.keys(shiftLoading).forEach(k => delete shiftLoading[k]);
  me = await call('me'); render(); prefetch();
}
function initPull() {
  const ind = document.createElement('div'); ind.id = 'pull'; document.body.appendChild(ind);
  let y0 = null, dy = 0, busy = false;
  window.addEventListener('touchstart', e => { if (window.scrollY <= 0 && !document.getElementById('sheet') && !busy) { y0 = e.touches[0].clientY; dy = 0; } }, { passive: true });
  window.addEventListener('touchmove', e => {
    if (y0 == null) return;
    if (tabDragOn) { y0 = null; ind.style.opacity = 0; return; }   // тащат вкладку — не обновляем
    dy = e.touches[0].clientY - y0;
    if (dy <= 0) { ind.style.opacity = 0; return; }
    const k = Math.min(dy, 120);
    ind.style.opacity = Math.min(1, k / 70); ind.style.transform = `translate(-50%, ${k * 0.6}px) rotate(${k * 3}deg)`;
    ind.classList.toggle('ready', dy > 80);
  }, { passive: true });
  window.addEventListener('touchend', async () => {
    if (y0 == null) return; y0 = null;
    if (dy > 80) {
      busy = true; ind.classList.add('spin'); ind.style.transform = 'translate(-50%, 40px)';
      try { await refreshAll(); toast('Обновлено ✨'); } catch (e) { toast(e.message); }
      busy = false; ind.classList.remove('spin');
    }
    ind.style.opacity = 0; ind.style.transform = 'translate(-50%, 0)'; ind.classList.remove('ready');
  });
}

(async function init() {
  const fail = (ic, t, s) => app.innerHTML = `<main style="padding-top:40px">${empty(ic, t, s)}</main>`;
  if (!tg || !tg.initData) return fail('📱', 'Открой через бота', 'Приложение работает только внутри Телеграма.');
  tg.ready(); tg.expand();
  applyTheme();
  try { tg.onEvent('themeChanged', applyTheme); } catch (e) {}
  try { tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (e) {}
  if (!API) return fail('🔌', 'Нет адреса сервера', 'Открой приложение кнопкой в боте.');
  try {
    me = await call('me');
    const restored = me.canClose && loadDraft();
    const h = new Date().getHours();
    if (me.canClose && (h >= 20 || h < 3)) tab = 'count';
    if (me.orderer && !me.isAdmin) tab = 'order';
    if (restored) tab = 'count';
    render();
    prefetch();
    if (restored) setTimeout(() => toast('Черновик закрытия восстановлен ✍️'), 400);
    initKeyboard();
  } catch (e) { fail('🔒', esc(e.message), ''); }
})();
